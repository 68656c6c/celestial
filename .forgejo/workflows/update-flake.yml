name: update-flake

# Weekly flake.lock bump. Builds every host first, so an open PR means the
# update is known good and already in the cache. If no PR appears, the build
# failed: check the run.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  ATTIC_CACHE: celestial
  ATTIC_SERVER: https://attic.artesia.cloud
  ATTIC_CACHE_URL: https://attic.artesia.cloud/celestial
  LAB_RESOLVER: 10.44.4.2
  NIX_CONFIG: experimental-features = nix-command flakes
  UPDATE_BRANCH: update/flake-lock

jobs:
  update:
    runs-on: nix
    steps:
      - name: Prepare the job container
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          rm -rf /homeless-shelter

      # git.artesia.cloud and attic.artesia.cloud only exist in lab DNS, and
      # docker hands the container a resolver it cannot reach.
      - name: Point the job at the lab resolver
        run: |
          printf 'nameserver %s\nnameserver 1.1.1.1\n' "$LAB_RESOLVER" > /etc/resolv.conf
          curl -fsS -o /dev/null https://git.artesia.cloud/api/v1/version
          curl -fsS -o /dev/null "$ATTIC_CACHE_URL/nix-cache-info"

      - uses: actions/checkout@v4

      - name: Authorize private flake inputs
        env:
          FLAKE_TOKEN: ${{ secrets.FLAKE_TOKEN }}
        run: |
          git config --global \
            "url.https://68656c6c:$FLAKE_TOKEN@git.artesia.cloud/.insteadOf" \
            "ssh://git@git.artesia.cloud/"

      - name: Log in to attic
        run: attic login "$ATTIC_CACHE" "$ATTIC_SERVER" "${{ secrets.ATTIC_TOKEN }}"

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if git diff --quiet flake.lock; then
            echo "flake.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.update.outputs.changed == 'true'
        run: nix flake check

      - name: Build and push every host
        if: steps.update.outputs.changed == 'true'
        run: ./scripts/build-hosts.sh

      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@artesia.cloud"
          git checkout -B "$UPDATE_BRANCH"
          {
            echo "flake.lock: update inputs"
            echo
            grep -E "^(• Updated input|    '|  → )" "$RUNNER_TEMP/update.log" || true
          } > "$RUNNER_TEMP/commit.msg"
          git commit -F "$RUNNER_TEMP/commit.msg" flake.lock
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$UPDATE_BRANCH"

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          open="$(curl -fsS -H "Authorization: token $TOKEN" \
            "$api/pulls?state=open&limit=50" \
            | jq -r --arg head "$UPDATE_BRANCH" '[.[] | select(.head.ref == $head)] | length')"
          if [ "$open" != "0" ]; then
            echo "pull request for $UPDATE_BRANCH already open, branch updated"
            exit 0
          fi
          body="$(sed '1,2d' "$RUNNER_TEMP/commit.msg")"
          jq -n --arg head "$UPDATE_BRANCH" --arg body "$body" \
            '{ head: $head, base: "main", title: "flake.lock: update inputs",
               body: ("Every host built and is in the attic cache.\n\n```\n" + $body + "\n```") }' \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                -d @- "$api/pulls" \
            | jq -r '.html_url'
