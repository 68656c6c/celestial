name: build-hosts

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ATTIC_CACHE: celestial
  ATTIC_SERVER: https://attic.artesia.cloud
  ATTIC_CACHE_URL: https://attic.artesia.cloud/celestial
  LAB_RESOLVER: 10.44.4.2
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  build:
    runs-on: nix
    steps:
      - name: Prepare the job container
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          rm -rf /homeless-shelter

      # git.artesia.cloud and attic.artesia.cloud only exist in lab DNS, and
      # docker hands the container a resolver it cannot reach.
      - name: Point the job at the lab resolver
        run: |
          printf 'nameserver %s\nnameserver 1.1.1.1\n' "$LAB_RESOLVER" > /etc/resolv.conf
          curl -fsS -o /dev/null https://git.artesia.cloud/api/v1/version
          curl -fsS -o /dev/null "$ATTIC_CACHE_URL/nix-cache-info"

      - uses: actions/checkout@v4

      - name: Authorize private flake inputs
        env:
          FLAKE_TOKEN: ${{ secrets.FLAKE_TOKEN }}
        run: |
          git config --global \
            "url.https://68656c6c:$FLAKE_TOKEN@git.artesia.cloud/.insteadOf" \
            "ssh://git@git.artesia.cloud/"

      - name: Log in to attic
        run: attic login "$ATTIC_CACHE" "$ATTIC_SERVER" "${{ secrets.ATTIC_TOKEN }}"

      - name: Lint
        run: nix flake check

      - name: Build and push every host
        run: ./scripts/build-hosts.sh
