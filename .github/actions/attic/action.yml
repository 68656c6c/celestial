name: attic
description: >
  Reach the attic cache. With a Tailscale OAuth client the runner first joins
  the tailnet as a short-lived tagged device and reaches attic over it, under
  its usual name so the certificate stays valid; without one attic has to be
  reachable from the internet. The cache is public to read, so only the push
  needs the token, through `attic login`.

inputs:
  public-url:
    description: URL of the attic server
    default: https://attic.cl2.artesia.cloud
  cache:
    description: Cache name
    default: celestial
  attic-token:
    description: attic token with pull and push permission on the cache
    required: true
  tailscale-client-id:
    description: Tailscale OAuth client ID, empty to reach attic without the tailnet
    default: ""
  tailscale-secret:
    description: Secret of that OAuth client
    default: ""
  tailscale-tags:
    description: Tags the runner joins with, the ones the OAuth client owns
    default: tag:github-ci
  tailnet-host:
    description: Name of the attic machine on the tailnet
    default: attic

runs:
  using: composite
  steps:
    - name: Join the tailnet
      if: inputs.tailscale-client-id != ''
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        oauth-secret: ${{ inputs.tailscale-secret }}
        tags: ${{ inputs.tailscale-tags }}
        ping: ${{ inputs.tailnet-host }}

    - name: Point the attic name at the tailnet
      if: inputs.tailscale-client-id != ''
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        TAILNET_HOST: ${{ inputs.tailnet-host }}
      run: |
        host="${PUBLIC_URL#*://}"; host="${host%%/*}"
        address="$(tailscale ip -4 "$TAILNET_HOST")"
        echo "$address $host" | sudo tee -a /etc/hosts

    - name: Check the cache answers
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
        TAILNET: ${{ inputs.tailscale-client-id != '' }}
        TAILNET_HOST: ${{ inputs.tailnet-host }}
      run: |
        tries=1
        [ "$TAILNET" = true ] && tries=10
        for _ in $(seq "$tries"); do
          if curl -fsS -m 10 -o /dev/null "$PUBLIC_URL/$CACHE/nix-cache-info" 2>/dev/null; then
            echo "attic reachable at $PUBLIC_URL"
            exit 0
          fi
          [ "$tries" = 1 ] || sleep 3
        done
        echo "::error::$PUBLIC_URL/$CACHE/nix-cache-info did not answer with 200; 401 means the cache is not public, no answer over the tailnet means the ACL does not let the runner's tag reach attic on 443 or attic's firewall drops it" >&2
        curl -sS -i -m 10 "$PUBLIC_URL/$CACHE/nix-cache-info" | head -15 >&2 || true
        if [ "$TAILNET" = true ]; then
          tailscale ping -c 1 "$TAILNET_HOST" >&2 || true
        fi
        exit 1

    - name: Install attic-client from the flake's nixpkgs
      shell: bash
      run: echo "$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#attic-client)/bin" >> "$GITHUB_PATH"

    - name: Log in to attic
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: attic login "$CACHE" "$PUBLIC_URL" "$ATTIC_TOKEN"
