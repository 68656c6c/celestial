name: attic
description: >
  Log in to the attic cache. The attic resource in Pangolin is public, attic's
  own token gates pushes and reads are anonymous, the same way the hosts use
  it inside the lab.

inputs:
  public-url:
    description: URL of the attic server
    default: https://attic.artesia.cloud
  cache:
    description: Cache name
    default: celestial
  attic-token:
    description: attic server token with push permission on the cache
    required: true

runs:
  using: composite
  steps:
    - name: Install attic-client from the flake's nixpkgs
      shell: bash
      run: echo "$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#attic-client)/bin" >> "$GITHUB_PATH"

    - name: Check the cache answers
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
      run: |
        if curl -fsS -o /dev/null "$PUBLIC_URL/$CACHE/nix-cache-info"; then
          echo "attic reachable at $PUBLIC_URL"
          exit 0
        fi
        echo "::error::$PUBLIC_URL/$CACHE/nix-cache-info did not answer with 200; a 401 or 302 means the Pangolin resource still has authentication on" >&2
        curl -sS -i "$PUBLIC_URL/$CACHE/nix-cache-info" | head -15 >&2 || true
        exit 1

    - name: Log in to attic
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: attic login "$CACHE" "$PUBLIC_URL" "$ATTIC_TOKEN"
