name: attic
description: >
  Reach the attic cache. With Pangolin credentials the runner first joins
  Pangolin as a machine client and reaches attic over that tunnel; without
  them the Pangolin resource has to be public. The cache is public to read,
  so only the push needs the token, through `attic login`.

inputs:
  public-url:
    description: URL of the attic server
    default: https://attic.cl2.artesia.cloud
  cache:
    description: Cache name
    default: celestial
  attic-token:
    description: attic token with pull and push permission on the cache
    required: true
  pangolin-endpoint:
    description: URL of the Pangolin server, empty to reach attic without a tunnel
    default: ""
  pangolin-id:
    description: ID of a Pangolin machine client that may reach attic
    default: ""
  pangolin-secret:
    description: Secret of that machine client
    default: ""

runs:
  using: composite
  steps:
    - name: Join Pangolin
      if: inputs.pangolin-id != ''
      shell: bash
      env:
        PANGOLIN_ENDPOINT: ${{ inputs.pangolin-endpoint }}
        PANGOLIN_CLIENT_ID: ${{ inputs.pangolin-id }}
        PANGOLIN_CLIENT_SECRET: ${{ inputs.pangolin-secret }}
      run: |
        pangolin="$(nix build --inputs-from . --no-link --print-out-paths unstable#pangolin-cli)/bin/pangolin"
        printf 'PANGOLIN_ENDPOINT=%s\nPANGOLIN_CLIENT_ID=%s\nPANGOLIN_CLIENT_SECRET=%s\nHOME=/var/lib/pangolin\n' \
          "$PANGOLIN_ENDPOINT" "$PANGOLIN_CLIENT_ID" "$PANGOLIN_CLIENT_SECRET" \
          | sudo install -m 0600 /dev/stdin /run/pangolin.env
        sudo mkdir -p /var/lib/pangolin
        sudo systemd-run --unit pangolin-client \
          --property EnvironmentFile=/run/pangolin.env \
          --property Restart=always --property RestartSec=5 \
          "$pangolin" up client --attach

    - name: Check the cache answers
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
        TUNNEL: ${{ inputs.pangolin-id != '' }}
      run: |
        tries=1
        [ "$TUNNEL" = true ] && tries=30
        for _ in $(seq "$tries"); do
          if curl -fsS -m 10 -o /dev/null "$PUBLIC_URL/$CACHE/nix-cache-info" 2>/dev/null; then
            echo "attic reachable at $PUBLIC_URL"
            exit 0
          fi
          [ "$tries" = 1 ] || sleep 3
        done
        echo "::error::$PUBLIC_URL/$CACHE/nix-cache-info did not answer with 200; 401 means the cache is not public, 302 means the Pangolin resource still has authentication on, 404 from the proxy or a reset connection means Pangolin does not route to attic for this client" >&2
        curl -sS -i -m 10 "$PUBLIC_URL/$CACHE/nix-cache-info" | head -15 >&2 || true
        if [ "$TUNNEL" = true ]; then
          sudo journalctl -u pangolin-client -n 40 --no-pager >&2 || true
        fi
        exit 1

    - name: Install attic-client from the flake's nixpkgs
      shell: bash
      run: echo "$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#attic-client)/bin" >> "$GITHUB_PATH"

    - name: Log in to attic
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        CACHE: ${{ inputs.cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: attic login "$CACHE" "$PUBLIC_URL" "$ATTIC_TOKEN"
