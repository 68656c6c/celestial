name: update-flake

# Weekly flake.lock bump. Every host is built and cached before the pull
# request exists, so an open PR is known good. No PR means the build failed.
# The build is called from here on purpose: a push made with GITHUB_TOKEN
# never triggers other workflows.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPDATE_BRANCH: update/flake-lock

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      summary: ${{ steps.update.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if git diff --quiet flake.lock; then
            echo "flake.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<SUMMARY_EOF"
            grep -E "^(• Updated input|    '|  → )" "$RUNNER_TEMP/update.log" || true
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          {
            echo "flake.lock: update inputs"
            echo
            grep -E "^(• Updated input|    '|  → )" "$RUNNER_TEMP/update.log" || true
          } > "$RUNNER_TEMP/commit.msg"
          git commit -F "$RUNNER_TEMP/commit.msg" flake.lock
          git push --force origin "$UPDATE_BRANCH"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build-hosts.yml
    with:
      ref: update/flake-lock
    secrets: inherit

  pull-request:
    needs: [update, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.update.outputs.summary }}
        run: |
          body="$(printf 'Every host built and is in the attic cache.\n\n```\n%s\n```\n' "$SUMMARY")"
          existing="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "updated pull request #$existing"
          else
            gh pr create --head "$UPDATE_BRANCH" --base main \
              --title "flake.lock: update inputs" --body "$body"
          fi
