name: build-hosts

# Builds every host and pushes the closures to attic, skipping hosts that
# are already cached. Pull requests are built but not pushed. Hosts come
# from the folders under system/per_host.

on:
  push:
    branches: [main]
    # documentation can never be a build input
    paths-ignore:
      - "**.md"
      - docs/**
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true

env:
  ATTIC_CACHE: celestial
  ATTIC_PUBLIC_URL: ${{ vars.ATTIC_PUBLIC_URL || 'https://attic.cl2.artesia.cloud' }}
  ATTIC_CACHE_URL: ${{ vars.ATTIC_PUBLIC_URL || 'https://attic.cl2.artesia.cloud' }}/celestial
  PUSH: ${{ github.event_name == 'pull_request' && '0' || '1' }}

permissions:
  contents: read

concurrency:
  group: build-hosts-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails the run without holding the builds back: a formatting slip
  # leaves every toplevel as it was, so what is built meanwhile is kept.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # flake inputs from the GitHub Actions cache, see the build job
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
          diff-store: true

      - name: Lint and evaluate
        run: nix flake check --no-write-lock-file

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # flake inputs from the GitHub Actions cache, see the build job
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
          diff-store: true

      - name: List hosts
        id: hosts
        run: |
          hosts="$(nix eval --json --no-write-lock-file .#nixosConfigurations --apply builtins.attrNames)"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "building: $hosts"

  build:
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Dependabot pull requests run without repository secrets: no attic then
      HAS_ATTIC: ${{ secrets.ATTIC_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      # A hosted runner has ~14 GB free, a NixOS closure needs more.
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # 2026-06-19

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            fallback = true
            download-attempts = 8
            connect-timeout = 10
            stalled-download-timeout = 60
            extra-substituters = https://celestial.cachix.org https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = celestial:Ii3291OUFcJwNBkfMT3+oZn4V7yC+5XswXiWdoJ7peM= celestial.cachix.org-1:27CYgl28WMa6OGwoAK5WrTQVKmJIIhJYvOBpapp9ETk= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      # Store paths in the GitHub Actions cache, which is close to the runner:
      # flake inputs and what came from attic, cachix or nyx are fetched from
      # there on the next run instead of over the lab uplink. Paths from
      # cache.nixos.org are left out, that CDN is fast already. The cache holds
      # 10 GB per repository, the oldest entries go first.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
          # every new path, not only what the job built: almost nothing is
          # built, nearly everything is substituted
          diff-store: true

      # Not fatal here: without attic the host is still built and goes to
      # cachix, and the script fails the job afterwards.
      - uses: ./.github/actions/attic
        id: attic
        if: env.HAS_ATTIC == 'true'
        continue-on-error: true
        timeout-minutes: 10
        with:
          public-url: ${{ env.ATTIC_PUBLIC_URL }}
          cache: ${{ env.ATTIC_CACHE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          tailscale-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Build and push ${{ matrix.host }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          ATTIC_UP: ${{ steps.attic.outcome == 'success' }}
          # attic serves downloads only once it answered, and after cachix:
          # both hold what CI built, cachix is a CDN and attic sits behind
          # the lab's uplink, which every job of the run shares
          NIX_CONFIG: ${{ steps.attic.outcome == 'success' && format('extra-substituters = {0}?priority=45', env.ATTIC_CACHE_URL) || '' }}
          # through the environment, not pasted into the script: the name is a
          # folder name from the checkout, which on a pull request is anyone's
          HOST: ${{ matrix.host }}
        run: ./scripts/build-hosts.sh "$HOST"
