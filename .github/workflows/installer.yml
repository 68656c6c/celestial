name: installer

# Builds the bootable installer image and publishes it as the rolling
# `installer` release: one ISO plus its sha256, replaced on every build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - installer/**
      - disko/**
      - diy-modules/host_disk.nix
      - flake.lock
      - .github/workflows/installer.yml

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874 # 2026-06-19

      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://celestial.cachix.org
            extra-trusted-public-keys = celestial.cachix.org-1:27CYgl28WMa6OGwoAK5WrTQVKmJIIhJYvOBpapp9ETk=

      - name: Build the image
        run: |
          nix build .#installer-iso --print-build-logs --no-write-lock-file
          cp result/iso/*.iso celestial-installer.iso
          sha256sum celestial-installer.iso > celestial-installer.iso.sha256
          ls -lh celestial-installer.iso

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Unattended: boots, matches the machine by DMI, wipes its internal disk after a 15 second countdown."
          if gh release view installer >/dev/null 2>&1; then
            gh release edit installer --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release create installer --prerelease --title "installer" --notes "$notes"
          fi
          gh release upload installer --clobber celestial-installer.iso celestial-installer.iso.sha256
          git push --force origin "HEAD:refs/tags/installer"
